# lazydesktop-addons Rust crate project
language: 'rust'
layer: 'library'

tasks:
  build:
    command: 'cargo'
    args: ['build', '-p', 'lazydesktop-addons']
    inputs:
      - 'crates/addons/**/*'

  test:
    command: 'cargo'
    args: ['test', '-p', 'lazydesktop-addons']
    inputs:
      - 'crates/addons/**/*'

  lint:
    command: 'cargo'
    args: ['clippy', '-p', 'lazydesktop-addons', '--', '-D', 'warnings']
    inputs:
      - 'crates/addons/**/*'

  format:
    command: 'cargo'
    args: ['fmt', '-p', 'lazydesktop-addons', '--', '--check']
    inputs:
      - 'crates/addons/**/*'

  format-fix:
    command: 'cargo'
    args: ['fmt', '-p', 'lazydesktop-addons']
    inputs:
      - 'crates/addons/**/*'
