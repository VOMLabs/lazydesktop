[package]
name = "lazydesktop-addons"
version = "0.1.0"
edition = "2021"
description = "LazyDesktop addon system security core: package parsing, validation, resource access, and C ABI."

[lib]
crate-type = ["staticlib"]
name = "addons"

[dependencies]
# Zip parsing with streaming extraction. deflate enables the standard method-8
# entries; the default miniz_oxide backend is pure Rust (no C dependency).
zip = { version = "2.4", default-features = false, features = ["deflate"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "2"
walkdir = "2"

# Concurrency/performance: rayon for CPU-bound loops, dashmap for the entries
# state map, tokio + flume for offloading blocking package preparation off the
# FFI thread (FFI entry points stay synchronous).
rayon = "1.10"
dashmap = "6"
tokio = { version = "1", features = ["rt-multi-thread"] }
flume = "0.11"

[dev-dependencies]
tempfile = "3"
proptest = "1"
crc32fast = "1"
