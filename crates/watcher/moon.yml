# lazydesktop-watcher Rust crate project
language: 'rust'
layer: 'library'

tasks:
  build:
    command: 'cargo'
    args: ['build', '-p', 'lazydesktop-watcher']
    inputs:
      - 'crates/watcher/**/*'

  test:
    command: 'cargo'
    args: ['test', '-p', 'lazydesktop-watcher']
    inputs:
      - 'crates/watcher/**/*'

  lint:
    command: 'cargo'
    args: ['clippy', '-p', 'lazydesktop-watcher', '--', '-D', 'warnings']
    inputs:
      - 'crates/watcher/**/*'

  format:
    command: 'cargo'
    args: ['fmt', '-p', 'lazydesktop-watcher', '--', '--check']
    inputs:
      - 'crates/watcher/**/*'

  format-fix:
    command: 'cargo'
    args: ['fmt', '-p', 'lazydesktop-watcher']
    inputs:
      - 'crates/watcher/**/*'
