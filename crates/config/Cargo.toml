[package]
name = "lazydesktop-config"
version = "0.1.0"
edition = "2021"
description = "LazyDesktop configuration: settings (INI), projects (YAML), themes (YAML)."

[lib]
crate-type = ["staticlib"]
name = "config"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
