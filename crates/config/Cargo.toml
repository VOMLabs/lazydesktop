[package]
name = "lazydesktop-config"
version = "0.1.0"
edition = "2021"
description = "LazyDesktop configuration: settings (INI), projects (Lua), themes (Lua)."

[lib]
crate-type = ["staticlib", "rlib"]
name = "config"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
