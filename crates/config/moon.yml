# lazydesktop-config Rust crate project
language: 'rust'
layer: 'library'

tasks:
  build:
    command: 'cargo'
    args: ['build', '-p', 'lazydesktop-config']
    inputs:
      - 'crates/config/**/*'

  test:
    command: 'cargo'
    args: ['test', '-p', 'lazydesktop-config']
    inputs:
      - 'crates/config/**/*'

  lint:
    command: 'cargo'
    args: ['clippy', '-p', 'lazydesktop-config', '--', '-D', 'warnings']
    inputs:
      - 'crates/config/**/*'

  format:
    command: 'cargo'
    args: ['fmt', '-p', 'lazydesktop-config', '--', '--check']
    inputs:
      - 'crates/config/**/*'

  format-fix:
    command: 'cargo'
    args: ['fmt', '-p', 'lazydesktop-config']
    inputs:
      - 'crates/config/**/*'
