[package]
name = "model_manager"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
llama-cpp-2 = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["rustls-tls", "stream"], default-features = false }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
futures-util = "0.3"

