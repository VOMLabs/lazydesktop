# vcs_core Rust crate project
language: 'rust'
layer: 'library'

tasks:
  build:
    command: 'cargo'
    args: ['build', '-p', 'vcs_core']
    inputs:
      - 'crates/vcs_core/**/*'

  test:
    command: 'cargo'
    args: ['test', '-p', 'vcs_core']
    inputs:
      - 'crates/vcs_core/**/*'

  lint:
    command: 'cargo'
    args: ['clippy', '-p', 'vcs_core', '--', '-D', 'warnings']
    inputs:
      - 'crates/vcs_core/**/*'

  format:
    command: 'cargo'
    args: ['fmt', '-p', 'vcs_core', '--', '--check']
    inputs:
      - 'crates/vcs_core/**/*'

  format-fix:
    command: 'cargo'
    args: ['fmt', '-p', 'vcs_core']
    inputs:
      - 'crates/vcs_core/**/*'
