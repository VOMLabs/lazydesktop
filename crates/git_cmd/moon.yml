# lazydesktop-git-cmd Rust crate project
language: 'rust'
layer: 'library'

tasks:
  build:
    command: 'cargo'
    args: ['build', '-p', 'lazydesktop-git-cmd']
    inputs:
      - 'crates/git_cmd/**/*'

  test:
    command: 'cargo'
    args: ['test', '-p', 'lazydesktop-git-cmd']
    inputs:
      - 'crates/git_cmd/**/*'

  lint:
    command: 'cargo'
    args: ['clippy', '-p', 'lazydesktop-git-cmd', '--', '-D', 'warnings']
    inputs:
      - 'crates/git_cmd/**/*'

  format:
    command: 'cargo'
    args: ['fmt', '-p', 'lazydesktop-git-cmd', '--', '--check']
    inputs:
      - 'crates/git_cmd/**/*'

  format-fix:
    command: 'cargo'
    args: ['fmt', '-p', 'lazydesktop-git-cmd']
    inputs:
      - 'crates/git_cmd/**/*'
