# git_cmd Rust crate project
language: 'rust'
layer: 'library'

tasks:
  build:
    command: 'cargo build --manifest-path crates/git_cmd/Cargo.toml'
    inputs:
      - 'crates/git_cmd/**/*'
    outputs:
      - 'target/debug/libgit_cmd.a'
      - 'target/release/libgit_cmd.a'

  test:
    command: 'cargo test --manifest-path crates/git_cmd/Cargo.toml'
    inputs:
      - 'crates/git_cmd/**/*'

  lint:
    command: 'cargo clippy --manifest-path crates/git_cmd/Cargo.toml -- -D warnings'
    inputs:
      - 'crates/git_cmd/**/*'

  format:
    command: 'cargo fmt --manifest-path crates/git_cmd/Cargo.toml -- --check'
    inputs:
      - 'crates/git_cmd/**/*'

  format-fix:
    command: 'cargo fmt --manifest-path crates/git_cmd/Cargo.toml'
    inputs:
      - 'crates/git_cmd/**/*'
