[package]
name = "lazydesktop-git-cmd"
version = "0.1.0"
edition = "2021"
description = "LazyDesktop git/jj CLI command execution wrapper."

[lib]
crate-type = ["staticlib"]
name = "git_cmd"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
