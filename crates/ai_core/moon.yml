# ai_core Rust crate project
language: 'rust'
layer: 'library'

tasks:
  build:
    command: 'cargo'
    args: ['build', '-p', 'ai_core']
    inputs:
      - 'crates/ai_core/**/*'

  test:
    command: 'cargo'
    args: ['test', '-p', 'ai_core']
    inputs:
      - 'crates/ai_core/**/*'

  lint:
    command: 'cargo'
    args: ['clippy', '-p', 'ai_core', '--', '-D', 'warnings']
    inputs:
      - 'crates/ai_core/**/*'

  format:
    command: 'cargo'
    args: ['fmt', '-p', 'ai_core', '--', '--check']
    inputs:
      - 'crates/ai_core/**/*'

  format-fix:
    command: 'cargo'
    args: ['fmt', '-p', 'ai_core']
    inputs:
      - 'crates/ai_core/**/*'
