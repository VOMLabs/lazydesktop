[package]
name = "ai_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
# OpenMP is a default feature of llama-cpp-2, but there is no OpenMP
# framework on macOS and it complicates the MSVC/Windows build too; llama.cpp
# uses its own threading without it. `common` provides the helper APIs used
# by the FFI bridge.
llama-cpp-2 = { version = "0.1", default-features = false, features = ["common"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = { version = "0.13", features = ["rustls", "stream"], default-features = false }
sha2 = "0.11"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
