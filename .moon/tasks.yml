# Shared tasks inherited by all projects
# https://moonrepo.dev/docs/config/tasks

tasks:
  test:
    command: 'cargo'
    args: ['test', '--workspace']
    inputs:
      - 'crates/**/*'
      - 'Cargo.toml'

  lint:
    command: 'cargo'
    args: ['clippy', '--workspace', '--all-targets', '--', '-D', 'warnings']
    inputs:
      - 'crates/**/*'
      - 'Cargo.toml'

  format:
    command: 'cargo'
    args: ['fmt', '--all', '--', '--check']
    inputs:
      - 'crates/**/*'
      - 'Cargo.toml'

  format-fix:
    command: 'cargo'
    args: ['fmt', '--all']
    inputs:
      - 'crates/**/*'
      - 'Cargo.toml'

  audit:
    command: 'cargo'
    args: ['audit']
    inputs:
      - 'crates/**/*'
      - 'Cargo.toml'
