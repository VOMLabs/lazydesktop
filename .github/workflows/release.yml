name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-linux:
    name: Linux (.deb + .AppImage)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 file

      - name: Build Rust crates
        run: cargo build --workspace --release

      - name: Strip binary
        run: strip target/release/lazydesktop

      - name: Build .deb
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="debroot"
          rm -rf "${PKG}"
          mkdir -p "${PKG}/DEBIAN"
          install -Dm755 target/release/lazydesktop "${PKG}/usr/bin/lazydesktop"
          install -Dm644 data/lazydesktop.desktop "${PKG}/usr/share/applications/lazydesktop.desktop"
          install -Dm644 data/icons/hicolor/scalable/apps/lazydesktop.svg "${PKG}/usr/share/icons/hicolor/scalable/apps/lazydesktop.svg"
          cat > "${PKG}/DEBIAN/control" <<EOF
          Package: lazydesktop
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: LazyDesktop Team <team@lazydesktop.dev>
          Depends: git, shared-mime-info
          Description: A native Git GUI for the KDE Plasma desktop
           LazyDesktop is a fast, native Git client built with Rust and GPUI.
          EOF
          dpkg-deb --build --root-owner-group "${PKG}" "lazydesktop_${VERSION}_amd64.deb"

      - name: Build .AppImage
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export PATH="$PWD:$PATH"
          rm -rf AppDir
          mkdir -p AppDir
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable target/release/lazydesktop \
            --desktop-file data/lazydesktop.desktop \
            --icon-file data/icons/hicolor/scalable/apps/lazydesktop.svg \
            --output appimage
          mv LazyDesktop-*.AppImage "lazydesktop-${VERSION}-x86_64.AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lazydesktop-linux
          path: |
            lazydesktop_*.deb
            lazydesktop-*-x86_64.AppImage

  release-arch:
    name: Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel rust git clang cmake ninja python-pip

      - name: Build Rust crates
        run: cargo build --workspace --release

      - name: Package (.pkg.tar.zst)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="pkg"
          rm -rf "${PKG}"
          install -Dm755 target/release/lazydesktop "${PKG}/usr/bin/lazydesktop"
          install -Dm644 data/lazydesktop.desktop "${PKG}/usr/share/applications/lazydesktop.desktop"
          install -Dm644 data/icons/hicolor/scalable/apps/lazydesktop.svg "${PKG}/usr/share/icons/hicolor/scalable/apps/lazydesktop.svg"
          SIZE="$(du -sb "${PKG}" | cut -f1)"
          cat > "${PKG}/.PKGINFO" <<EOF
          pkgname = lazydesktop
          pkgbase = lazydesktop
          pkgver = ${VERSION}-1
          pkgdesc = A native Git GUI for the KDE Plasma desktop
          url = https://lazydesktop.dev
          builddate = $(date -u +%s)
          packager = LazyDesktop Team <team@lazydesktop.dev>
          size = ${SIZE}
          arch = x86_64
          license = MIT
          depend = git
          EOF
          chown -R root:root "${PKG}"
          bsdtar -cf "${PKG}/.MTREE" --format=mtree \
            --options='!all,use-set,type,uid,gid,mode,time,size,md5,sha256,link' \
            --exclude .MTREE --exclude .PKGINFO -C "${PKG}" .
          bsdtar -cf "lazydesktop-${VERSION}-1-x86_64.pkg.tar.zst" --zstd -C "${PKG}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lazydesktop-arch
          path: '*.pkg.tar.zst'

  release-windows:
    name: Windows (.msi)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Rust release binary
        run: cargo build --workspace --release

      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 4.0.5

      - name: Install WiX UI Extension
        run: wix extension add WixToolset.UI.wixext/4.0.5 --global

      - name: Generate MSI fragment
        run: |
          $BIN_DIR = "$env:GITHUB_WORKSPACE\target\release"
          & .\install\windows\deploy-msi.ps1 -BuildDir "$BIN_DIR" -OutputFile "$env:GITHUB_WORKSPACE\target\release\AppFiles.g.wxs"
          Write-Host "Generated fragment:"
          Get-Content "$env:GITHUB_WORKSPACE\target\release\AppFiles.g.wxs" | Select-Object -First 40

      - name: Build MSI
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          $BIN_DIR = "$env:GITHUB_WORKSPACE\target\release"
          wix build install/windows/lazydesktop.wxs "$BIN_DIR\AppFiles.g.wxs" `
            -out "lazydesktop-${VERSION}.msi" `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -d ProductVersion="$VERSION" `
            -d BuildDir="$BIN_DIR" `
            -d SourceDir="$env:GITHUB_WORKSPACE"

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: lazydesktop-windows
          path: '*.msi'

  create-release:
    name: Create GitHub Release
    needs: [release-linux, release-arch, release-windows]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate checksums
        run: |
          find . -maxdepth 3 \( -name '*.deb' -o -name '*.AppImage' -o -name '*.pkg.tar.zst' -o -name '*.msi' \) -type f -print0 \
            | xargs -0 sha256sum > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: LazyDesktop ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            **/*.deb
            **/*.AppImage
            **/*.pkg.tar.zst
            **/*.msi
            checksums.txt
