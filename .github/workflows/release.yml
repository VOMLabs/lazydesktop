name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-linux:
    name: Linux (.deb + .AppImage)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          package-cache: true
          build-cache: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-cpp-dev libgl1-mesa-dev file

      - name: Configure (release)
        run: xmake f -m release -y

      - name: Build
        run: xmake

      - name: Strip binary
        run: strip build/linux/x86_64/release/lazydesktop

      - name: Build .deb
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="debroot"
          rm -rf "${PKG}"
          mkdir -p "${PKG}/DEBIAN"
          install -Dm755 build/linux/x86_64/release/lazydesktop "${PKG}/usr/bin/lazydesktop"
          install -Dm644 data/lazydesktop.desktop "${PKG}/usr/share/applications/lazydesktop.desktop"
          install -Dm644 data/icons/hicolor/scalable/apps/lazydesktop.svg "${PKG}/usr/share/icons/hicolor/scalable/apps/lazydesktop.svg"
          cat > "${PKG}/DEBIAN/control" <<EOF
          Package: lazydesktop
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: LazyDesktop Team <team@lazydesktop.dev>
          Depends: qt6-base (>= 6.5), libyaml-cpp (>= 0.7), git
          Description: A KDE-native Git GUI alternative
           LazyDesktop is a fast, native Git client built with Qt 6 and C++23.
          EOF
          dpkg-deb --build --root-owner-group "${PKG}" "lazydesktop_${VERSION}_amd64.deb"

      - name: Build .AppImage
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage appimagetool-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export PATH="$PWD:$PATH"
          rm -rf AppDir
          mkdir -p AppDir
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/linux/x86_64/release/lazydesktop \
            --desktop-file data/lazydesktop.desktop \
            --icon-file data/icons/hicolor/scalable/apps/lazydesktop.svg \
            --plugin qt --output appimage
          mv LazyDesktop-*.AppImage "lazydesktop-${VERSION}-x86_64.AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lazydesktop-linux
          path: |
            lazydesktop_*.deb
            lazydesktop-*-x86_64.AppImage

  release-arch:
    name: Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root
    env:
      # xmake refuses to run as root unless explicitly allowed.
      XMAKE_ROOT: y

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          # clang provides libclang, required by the bindgen build script of
          # llama-cpp-sys-2 when compiling the bundled Rust ai_core crate.
          # cmake is needed by llama-cpp-sys-2 to configure/compile llama.cpp,
          # ninja is the default generator xmake uses for C++ builds.
          pacman -S --noconfirm base-devel xmake rust qt6-base yaml-cpp git clang cmake ninja

      - name: Configure (release)
        run: xmake f -m release -y

      - name: Build
        run: xmake

      - name: Package (.pkg.tar.zst)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="pkg"
          rm -rf "${PKG}"
          install -Dm755 build/linux/x86_64/release/lazydesktop "${PKG}/usr/bin/lazydesktop"
          install -Dm644 data/lazydesktop.desktop "${PKG}/usr/share/applications/lazydesktop.desktop"
          install -Dm644 data/icons/hicolor/scalable/apps/lazydesktop.svg "${PKG}/usr/share/icons/hicolor/scalable/apps/lazydesktop.svg"
          SIZE="$(du -sb "${PKG}" | cut -f1)"
          cat > "${PKG}/.PKGINFO" <<EOF
          pkgname = lazydesktop
          pkgbase = lazydesktop
          pkgver = ${VERSION}-1
          pkgdesc = A KDE-native Git GUI alternative
          url = https://lazydesktop.dev
          builddate = $(date -u +%s)
          packager = LazyDesktop Team <team@lazydesktop.dev>
          size = ${SIZE}
          arch = x86_64
          license = MIT
          depend = qt6-base
          depend = yaml-cpp
          depend = git
          EOF
          chown -R root:root "${PKG}"
          bsdtar -cf "${PKG}/.MTREE" --format=mtree \
            --options='!all,use-set,type,uid,gid,mode,time,size,md5,sha256,link' \
            --exclude .MTREE --exclude .PKGINFO -C "${PKG}" .
          bsdtar -cf "lazydesktop-${VERSION}-1-x86_64.pkg.tar.zst" --zstd -C "${PKG}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lazydesktop-arch
          path: '*.pkg.tar.zst'

  release-windows:
    name: Windows (.msi)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          package-cache: true
          build-cache: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7'
          # Qt 6.7 ships win64_msvc2019_64 only (MSVC2022 arch starts at Qt 6.8);
          # it is ABI-compatible with the MSVC 2022 toolchain used by xmake.
          arch: win64_msvc2019_64
          cache: true

      - name: Configure (release)
        run: xmake f -m release -y

      - name: Build
        run: xmake

      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 4.0.5

      - name: Install WiX UI Extension
        # wix build does not auto-download extensions; the WixUI dialog set
        # ships in a separate NuGet package that must be cached first.
        run: wix extension add WixToolset.UI.wixext/4.0.5 --global

      - name: Deploy Qt runtime
        # windeployqt copies Qt DLLs/plugins next to the exe, then
        # deploy-msi.ps1 emits AppFiles.g.wxs listing every deployed file.
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          $QT_ROOT = $env:Qt6_DIR
          if (-not $QT_ROOT) {
            $qmake = Get-Command qmake6.exe, qmake.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            $QT_ROOT = Split-Path (Split-Path $qmake.Source)
          }
          $BIN_DIR = "$env:GITHUB_WORKSPACE\build\windows\x64\release"
          & .\install\windows\deploy-msi.ps1 -BuildDir "$BIN_DIR" -QtRoot "$QT_ROOT" -OutputFile "$env:GITHUB_WORKSPACE\install\windows\AppFiles.g.wxs"
          Write-Host "Generated fragment:"
          Get-Content .\install\windows\AppFiles.g.wxs | Select-Object -First 40

      - name: Build MSI
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          $QT_ROOT = $env:Qt6_DIR
          if (-not $QT_ROOT) {
            $qmake = Get-Command qmake6.exe, qmake.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            $QT_ROOT = Split-Path (Split-Path $qmake.Source)
          }
          $BIN_DIR = "$env:GITHUB_WORKSPACE\build\windows\x64\release"
          wix build install/windows/lazydesktop.wxs install/windows/AppFiles.g.wxs `
            -out "lazydesktop-${VERSION}.msi" `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -d ProductVersion="$VERSION" `
            -d BuildDir="$BIN_DIR" `
            -d QtDir="$QT_ROOT" `
            -d SourceDir="$env:GITHUB_WORKSPACE"

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: lazydesktop-windows
          path: '*.msi'

  create-release:
    name: Create GitHub Release
    needs: [release-linux, release-arch, release-windows]
    # Always create a GitHub Release on tag push, even if one or more
    # platform jobs fail, so a tag never ends up without a release.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate checksums
        run: |
          find . -maxdepth 3 \( -name '*.deb' -o -name '*.AppImage' -o -name '*.pkg.tar.zst' -o -name '*.msi' \) -type f -print0 \
            | xargs -0 sha256sum > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: LazyDesktop ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            **/*.deb
            **/*.AppImage
            **/*.pkg.tar.zst
            **/*.msi
            checksums.txt
