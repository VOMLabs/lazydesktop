name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7"
          modules: qtnetwork

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7"
          arch: win64_msvc2022_64
          modules: qtnetwork

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7"
          modules: qtnetwork

      - name: Install yaml-cpp (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libyaml-cpp-dev

      - name: Install yaml-cpp (macOS)
        if: runner.os == 'macOS'
        run: brew install yaml-cpp

      - name: Install yaml-cpp (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install yaml-cpp

      - name: Configure
        run: xmake f -m debug

      - name: Build
        run: xmake

      - name: Quick smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: QT_QPA_PLATFORM=offscreen timeout 3 xmake run 2>&1 || true
