name: CI

on:
  push:
    branches: [main]
    # Skip CI for documentation-only changes to main; PRs always run the
    # full suite so required status checks are never left pending.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.opencode/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2022
          - macos-14

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          package-cache: true
          build-cache: true

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7'
          cache: true

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7'
          # Qt 6.7 ships win64_msvc2019_64 only (MSVC2022 arch starts at Qt 6.8);
          # it is ABI-compatible with the MSVC 2022 toolchain used by xmake.
          arch: win64_msvc2019_64
          cache: true

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7'
          cache: true

      - name: Install yaml-cpp (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libyaml-cpp-dev libgl1-mesa-dev

      - name: Install yaml-cpp (macOS)
        if: runner.os == 'macOS'
        run: brew install yaml-cpp

      # yaml-cpp on Windows is provided by xmake itself: with
      # add_requires("yaml-cpp") (no {system = true}) xmake falls back to
      # fetching yaml-cpp from the xmake package repo when it cannot find a
      # system copy, so no vcpkg step is needed here.

      - name: Configure (debug)
        run: xmake f -m debug -y

      - name: Build
        run: xmake

      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          QT_QPA_PLATFORM=offscreen xmake run &
          APP_PID=$!
          sleep 5
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true

      - name: Upload binary artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: lazydesktop-${{ matrix.os }}
          path: build/*/*/debug/lazydesktop*
          if-no-files-found: error
          retention-days: 7

  test-rust:
    name: Rust tests (crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test --workspace

  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      # Full history is required so the diff below can resolve both
      # "HEAD~1..HEAD" (push) and the fetched base ref (pull_request).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run pre-commit hooks on changed files
        run: |
          pipx install pre-commit
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            CHANGED=$(git diff --name-only "FETCH_HEAD...$GITHUB_HEAD_REF")
          else
            CHANGED=$(git diff --name-only "HEAD~1" HEAD)
          fi
          echo "$CHANGED" | xargs -r pre-commit run --files
