name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.opencode/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Rust Quality Gate ───────────────────────────────────────
  rust-quality:
    name: Rust quality (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - clippy
          - fmt
          - test
          - audit

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.check == 'clippy' && 'clippy' || '' }}${{ matrix.check == 'fmt' && 'rustfmt' || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        if: matrix.check == 'audit'
        run: cargo install cargo-audit

      - name: Run clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        if: matrix.check == 'fmt'
        run: cargo fmt --all -- --check

      - name: Run tests
        if: matrix.check == 'test'
        run: cargo test --workspace

      - name: Security audit
        if: matrix.check == 'audit'
        run: cargo audit

  # ─── Build (Rust, all platforms) ──────────────────────────────
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [rust-quality]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2022
          - macos-14

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 xvfb

      - name: Build
        run: cargo build --workspace

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a bash -c '
            target/debug/lazydesktop &
            APP_PID=$!
            sleep 5
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          ' || echo "Smoke test failed (non-fatal)"

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          target/debug/lazydesktop &
          APP_PID=$!
          sleep 5
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true

      - name: Upload binary artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: lazydesktop-${{ matrix.os }}
          path: target/debug/lazydesktop*
          if-no-files-found: error
          retention-days: 7

  # ─── Lint (pre-commit on changed files) ─────────────────────
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run pre-commit hooks on changed files
        run: |
          pipx install pre-commit
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            CHANGED=$(git diff --name-only "FETCH_HEAD...$GITHUB_HEAD_REF")
          else
            CHANGED=$(git diff --name-only "HEAD~1" HEAD)
          fi
          echo "$CHANGED" | xargs -r pre-commit run --files
