version: 2
updates:
  # Keep the Rust ai_core crate up to date
  - package-ecosystem: cargo
    directory: /crates/ai_core
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    labels:
      - rust
      - dependencies

  # Keep GitHub Actions up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(ci)
    labels:
      - github_actions
      - dependencies
