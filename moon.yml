# LazyDesktop app project (Rust + GPUI)
# https://moonrepo.dev/docs/config/project

language: 'rust'
layer: 'application'

project:
  name: 'lazydesktop'
  description: 'A fast, native Git GUI for KDE Plasma'

tasks:
  build:
    command: 'cargo'
    args: ['build', '-p', 'lazydesktop-app']
    inputs:
      - 'crates/app/**/*'

  test:
    command: 'cargo'
    args: ['test', '-p', 'lazydesktop-app']
    inputs:
      - 'crates/app/**/*'

  lint:
    command: 'cargo'
    args: ['clippy', '-p', 'lazydesktop-app', '--', '-D', 'warnings']
    inputs:
      - 'crates/app/**/*'

  format:
    command: 'cargo'
    args: ['fmt', '-p', 'lazydesktop-app', '--', '--check']
    inputs:
      - 'crates/app/**/*'

  format-fix:
    command: 'cargo'
    args: ['fmt', '-p', 'lazydesktop-app']
    inputs:
      - 'crates/app/**/*'

  run:
    command: 'cargo'
    args: ['run', '-p', 'lazydesktop-app']