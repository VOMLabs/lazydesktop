# LazyDesktop app project
# https://moonrepo.dev/docs/config/project

language: 'cpp'
layer: 'application'

project:
  name: 'lazydesktop'
  description: 'A fast, native Git GUI for KDE Plasma'

tasks:
  build:
    script: 'meson setup build --buildtype=debugoptimized --reconfigure 2>/dev/null && ninja -C build'
    inputs:
      - 'src/**/*'
      - 'meson.build'
      - 'crates/*/include/*.h'
      - 'crates/ai_core/*.h'
      - 'crates/vcs_core/*.h'

  build-release:
    script: 'meson setup build --buildtype=release --reconfigure 2>/dev/null && ninja -C build'
    inputs:
      - 'src/**/*'
      - 'meson.build'

  run:
    command: 'build/lazydesktop'
    deps:
      - '~:build'

  format:
    command: 'clang-format'
    args: ['-i', '-style=file', 'src/*.cpp', 'src/*.h']
    inputs:
      - 'src/**/*'

  lint:
    command: 'clang-tidy'
    args: ['src/*.cpp', 'src/*.h', '--', '-std=c++23']
    inputs:
      - 'src/**/*'
